# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # O artigo do tutorial de Agronomia é um documento Quarto (.qmd), com
      # callouts e referências cruzadas de figura e tabela, e por isso exige o
      # Quarto instalado no runner.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Python com o Biblium torna o Módulo 10 do tutorial reproducível no site.
      # RETICULATE_PYTHON e o que o reticulate honra na INICIALIZACAO: o
      # use_python() chamado depois (pelo pacote) e ignorado, porque as vinhetas
      # de Python do site inicializam o interpretador antes do artigo.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Biblium
        run: |
          python -m pip install --upgrade pip
          PYEXE=$(python -c 'import sys; print(sys.executable)')
          echo "BIBLIOINTEGRATOR_PYTHON=$PYEXE" >> $GITHUB_ENV
          echo "RETICULATE_PYTHON=$PYEXE" >> $GITHUB_ENV
          echo "interprete configurado: $PYEXE"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # Instala o Biblium pelo reticulate, isto e, exatamente no interpretador
      # que as vinhetas e o artigo usam. O pip do sistema pode escrever em outro
      # prefixo de site-packages, e nesse caso py_module_available() devolve
      # FALSE mesmo com a instalacao bem-sucedida.
      - name: Instalar Biblium no Python do reticulate
        run: |
          Rscript -e '
            reticulate::py_install("biblium==2.16.0", pip = TRUE)
            cfg <- reticulate::py_config()
            cat("python:", cfg$python, "\n")
            cat("libpython:", cfg$libpython, "\n")
            cat("biblium importavel:", reticulate::py_module_available("biblium"), "\n")
          '

      # O pkgdown grava o YAML de metadados do Quarto com booleanos no estilo
      # YAML 1.1 ("yes"/"no"), que o Quarto le como texto e recusa, abortando a
      # renderizacao de qualquer artigo .qmd. O remendo converte para
      # "true"/"false"; ver tools/pkgdown-patch.R para o diagnostico completo.
      - name: Build site
        run: |
          source("tools/pkgdown-patch.R")
          ok <- tryCatch({
            pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
            TRUE
          }, error = function(e) {
            cat("\n=== FALHA NO BUILD DO SITE ===\n", conditionMessage(e), "\n")
            cat("=== artigos Quarto em modo verboso ===\n")
            try(pkgdown::build_articles(pkgdown::as_pkgdown("."), quiet = FALSE),
                silent = TRUE)
            FALSE
          })
          if (!ok) quit(status = 1)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.6.8
        with:
          clean: false
          branch: gh-pages
          folder: docs
