# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # O artigo do tutorial de Agronomia é um documento Quarto (.qmd), com
      # callouts e referências cruzadas de figura e tabela, e por isso exige o
      # Quarto instalado no runner.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Python com o Biblium torna o Módulo 10 do tutorial reproducível no site.
      # O reticulate cria e usa um virtualenv proprio (~/.virtualenvs/r-reticulate)
      # e e NELE que o py_install instala. Definir RETICULATE_PYTHON para o Python
      # base quebra o par: a sessao R roda no base, o pacote e instalado no
      # virtualenv, e py_module_available() devolve FALSE mesmo com a instalacao
      # bem-sucedida. Por isso o workflow NAO exporta RETICULATE_PYTHON e aponta
      # BIBLIOINTEGRATOR_PYTHON para o Python do virtualenv.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Instalar Biblium no ambiente do reticulate
        run: |
          Rscript -e '
            reticulate::py_install("biblium==2.16.0", pip = TRUE)
            py <- reticulate::virtualenv_python("r-reticulate")
            cat("python do virtualenv:", py, "\n")
            cat("biblium importavel:", reticulate::py_module_available("biblium"), "\n")
            cat(paste0("BIBLIOINTEGRATOR_PYTHON=", py), "\n",
                file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          '

      # O pkgdown grava o YAML de metadados do Quarto com booleanos no estilo
      # YAML 1.1 ("yes"/"no"), que o Quarto le como texto e recusa, abortando a
      # renderizacao de qualquer artigo .qmd. O remendo converte para
      # "true"/"false"; ver tools/pkgdown-patch.R para o diagnostico completo.
      - name: Build site
        run: |
          source("tools/pkgdown-patch.R")
          ok <- tryCatch({
            pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
            TRUE
          }, error = function(e) {
            cat("\n=== FALHA NO BUILD DO SITE ===\n", conditionMessage(e), "\n")
            cat("=== artigos Quarto em modo verboso ===\n")
            try(pkgdown::build_articles(pkgdown::as_pkgdown("."), quiet = FALSE),
                silent = TRUE)
            FALSE
          })
          if (!ok) quit(status = 1)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.6.8
        with:
          clean: false
          branch: gh-pages
          folder: docs
